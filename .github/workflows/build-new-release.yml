name: Build Jellyfin OSA AVPlayFix

on:
  workflow_dispatch:

concurrency:
  group: jellyfin-osa-avplayfix-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  TIZEN_STUDIO_VER: '4.5.1'

jobs:
  versions:
    name: Resolve latest Jellyfin Web versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      stable_tag: ${{ steps.resolve.outputs.stable_tag }}
      stable_sha: ${{ steps.resolve.outputs.stable_sha }}
      branch12_sha: ${{ steps.resolve.outputs.branch12_sha }}
      branch1011_sha: ${{ steps.resolve.outputs.branch1011_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Refresh version matrix for this run
        run: python3 scripts/sync_versions.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin exact refs
        id: resolve
        shell: bash
        run: |
          {
            echo "matrix=$(jq -c . matrix.json)"
            echo "stable_tag=$(jq -r '.stable.ref' versions.json)"
            echo "stable_sha=$(jq -r '.stable.sha' versions.json)"
            echo "branch12_sha=$(jq -r '.branches["12.z"].sha' versions.json)"
            echo "branch1011_sha=$(jq -r '.branches["10.11.z"].sha' versions.json)"
          } >> "$GITHUB_OUTPUT"
          cat versions.json >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ubuntu-latest
    needs: versions
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node24 == true && 'v24.18.0' || 'v23.11.1' }}

      - name: Install packaging prerequisites
        run: sudo apt-get install -y expect

      - name: Download Tizen Studio
        shell: bash
        run: |
          curl --fail --location --retry 3 --output tizen-installer "https://download.tizen.org/sdk/Installer/tizen-studio_$TIZEN_STUDIO_VER/web-cli_Tizen_Studio_$TIZEN_STUDIO_VER_ubuntu-64.bin"

      - name: Install Tizen Studio
        run: |
          chmod +x tizen-installer
          ./tizen-installer --accept-license "$GITHUB_WORKSPACE/tizen-studio"
          rm tizen-installer

      - name: Create disposable author certificate
        run: |
          ./tizen-studio/tools/ide/bin/tizen certificate -a JellyfinOSA -p 1234 -c PT -s Lisboa -ct Lisboa -o LocalTest -n JellyfinOSA -e jellyfinosa@example.invalid -f tizencert
          test -s "$GITHUB_WORKSPACE/tizencert.p12"

      - name: Configure Tizen certificate profile
        run: |
          ./tizen-studio/tools/ide/bin/tizen security-profiles add -n Jellyfin -a "$GITHUB_WORKSPACE/tizencert.p12" -p 1234
          ./tizen-studio/tools/ide/bin/tizen cli-config "profiles.path=$GITHUB_WORKSPACE/tizen-studio-data/profile/profiles.xml"
          chmod 755 "$GITHUB_WORKSPACE/tizen-studio-data/profile/profiles.xml"

      - name: Checkout known-working OSA Tizen wrapper
        uses: actions/checkout@v7
        with:
          repository: jeppevinkel/jellyfin-tizen
          ref: a798c36118117aa8d6eb6f11da35d040907c8840
          path: jellyfin-tizen

      - name: Checkout pinned Jellyfin Web
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.tag }}
          path: jellyfin-web

      - name: Apply AVPlayFix and Letterbox
        shell: bash
        run: |
          cp patches/osa/avplayVideoPlayer.js jellyfin-tizen/avplayVideoPlayer.js
          python3 scripts/apply-letterbox.py jellyfin-tizen/avplayVideoPlayer.js
          grep -q "PLAYER_DISPLAY_MODE_LETTER_BOX" jellyfin-tizen/avplayVideoPlayer.js
          grep -q "localplayersubtitleappearance3" jellyfin-tizen/avplayVideoPlayer.js

      - name: Build Jellyfin Web
        shell: bash
        working-directory: jellyfin-web
        run: |
          npm ci --no-audit
          USE_SYSTEM_FONTS=1 npm run build:production

      - name: Build Jellyfin Tizen client
        shell: bash
        run: |
          cp iconoblong.png jellyfin-tizen/icon.png
          cd jellyfin-tizen
          JELLYFIN_WEB_DIR=../jellyfin-web/dist npm ci --no-audit

      - name: Build Tizen web package
        working-directory: jellyfin-tizen
        run: |
          ../tizen-studio/tools/ide/bin/tizen build-web -e ".*" -e gulpfile.js -e README.md -e "node_modules/*" -e "package*.json" -e "yarn.lock"

      - name: Prepare certificate passwords for packager
        shell: bash
        run: |
          sed -i "s|$GITHUB_WORKSPACE/tizencert.pwd|1234|g" "$GITHUB_WORKSPACE/tizen-studio-data/profile/profiles.xml"
          sed -i "s|$GITHUB_WORKSPACE/tizen-studio-data/tools/certificate-generator/certificates/distributor/tizen-distributor-signer.pwd|tizenpkcs12passfordsigner|g" "$GITHUB_WORKSPACE/tizen-studio-data/profile/profiles.xml"
          sed -i 's|password=""|password="tizenpkcs12passfordsigner"|g' "$GITHUB_WORKSPACE/tizen-studio-data/profile/profiles.xml"

      - name: Package signed WGT
        shell: bash
        run: |
          expect ./package.exp
          test -s "jellyfin-tizen/release/Jellyfin.wgt"
          mv "jellyfin-tizen/release/Jellyfin.wgt" "jellyfin-tizen/release/${{ matrix.artifact_name }}.wgt"
          test -s "jellyfin-tizen/release/${{ matrix.artifact_name }}.wgt"

      - name: Print Tizen CLI diagnostics
        if: always()
        shell: bash
        run: |
          if [ -f tizen-studio-data/cli/logs/cli.log ]; then
            tail -n 100 tizen-studio-data/cli/logs/cli.log
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: jellyfin-tizen/release/${{ matrix.artifact_name }}.wgt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish three WGT files in GitHub Releases
    needs: [versions, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all three artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Verify all three WGT files exist
        shell: bash
        run: |
          for name in Jellyfin-OSA-AVPlayFix Jellyfin-12.z-OSA-AVPlayFix Jellyfin-10.11.z-OSA-AVPlayFix; do
            test -s "release-artifacts/$name/$name.wgt" || { echo "::error::Missing $name.wgt"; exit 1; }
          done
          count=$(find release-artifacts -type f -name '*.wgt' | wc -l)
          test "$count" -eq 3 || { echo "::error::Expected three WGT files, got $count"; exit 1; }

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ### Jellyfin OSA AVPlayFix — Samsung Tizen
          Includes AVPlay HDR/HDR10+ support, correct cinematic aspect ratio, repaired subtitle menu and subtitle appearance controls.

          | File | Jellyfin Web source |
          | --- | --- |
          | Jellyfin-OSA-AVPlayFix.wgt | Stable ${{ needs.versions.outputs.stable_tag }} (commit ${{ needs.versions.outputs.stable_sha }}) |
          | Jellyfin-12.z-OSA-AVPlayFix.wgt | release-12.z (commit ${{ needs.versions.outputs.branch12_sha }}) |
          | Jellyfin-10.11.z-OSA-AVPlayFix.wgt | release-10.11.z (commit ${{ needs.versions.outputs.branch1011_sha }}) |

          OSA Tizen base: a798c36118117aa8d6eb6f11da35d040907c8840.
          All three apps share one Tizen app ID. Re-sign with Apps2Samsung for installation.

          The stable version was tested on a Samsung TV. The 12.z and 10.11.z versions require runtime validation.
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: avplayfix-${{ github.run_number }}-${{ github.run_attempt }}
          name: 'Jellyfin OSA AVPlayFix build #${{ github.run_number }}'
          body_path: release-notes.md
          files: release-artifacts/**/*.wgt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
