name: Get Latest Versions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Check latest stable, 12.z and 10.11.z
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve upstream versions
        run: python3 scripts/sync_versions.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit only if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json matrix.json
          if git diff --cached --quiet; then
            echo "Nothing changed; no push required."
            exit 0
          fi
          git commit -m "Update latest Jellyfin Web versions"
          git push origin HEAD:master
